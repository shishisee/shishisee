<meta charset="utf-8">
<title>Q.E.D. 연구소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="미적분Ⅰ · 확률과 통계 · 미적분Ⅱ를 시뮬레이션으로 원리부터 익히는 개인 수학 연구소">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 밤의 칠판 벽. 상단 분필 띠 → 대시보드는 과목 3열 칠판, 연구실은 한 줄 연구노트(미스터리→실험대→추측→정리→결투장) */
:root{
  --board:#1d2925; --board-2:#24322d; --panel:#22302b; --chalk:#ebe7dc; --muted:#a3b2aa;
  --line:rgba(235,231,220,.16); --grid:rgba(235,231,220,.07); --axis:rgba(235,231,220,.55);
  --yellow:#f1d272; --sky:#8ecbe9; --pink:#f2a3bb; --green:#a9d9a0; --red:#f2876f;
  --yellow-fill:rgba(241,210,114,.22); --sky-fill:rgba(142,203,233,.22); --pink-fill:rgba(242,163,187,.22); --green-fill:rgba(169,217,160,.22);
  --dust:rgba(235,231,220,.035);
  --chalk-f:"Gaegu","Nanum Pen Script",cursive;
  --body-f:"Gowun Batang","Nanum Myeongjo",serif;
  --mono-f:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --board:#f5f4ee; --board-2:#ecebe2; --panel:#fbfaf6; --chalk:#1f2b33; --muted:#5c6a70;
  --line:rgba(31,43,51,.16); --grid:rgba(52,110,150,.10); --axis:rgba(31,43,51,.6);
  --yellow:#a87400; --sky:#1d6c9c; --pink:#b13d65; --green:#357a34; --red:#c0432a;
  --yellow-fill:rgba(168,116,0,.16); --sky-fill:rgba(29,108,156,.15); --pink-fill:rgba(177,61,101,.14); --green-fill:rgba(53,122,52,.15);
  --dust:rgba(52,110,150,.06); color-scheme:light; } }
:root[data-theme="light"]{
  --board:#f5f4ee; --board-2:#ecebe2; --panel:#fbfaf6; --chalk:#1f2b33; --muted:#5c6a70;
  --line:rgba(31,43,51,.16); --grid:rgba(52,110,150,.10); --axis:rgba(31,43,51,.6);
  --yellow:#a87400; --sky:#1d6c9c; --pink:#b13d65; --green:#357a34; --red:#c0432a;
  --yellow-fill:rgba(168,116,0,.16); --sky-fill:rgba(29,108,156,.15); --pink-fill:rgba(177,61,101,.14); --green-fill:rgba(53,122,52,.15);
  --dust:rgba(52,110,150,.06); color-scheme:light; }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important; transition:none!important} }
body{margin:0; background:var(--board); color:var(--chalk); font-family:var(--body-f); font-size:16.5px; line-height:1.75; word-break:keep-all; overflow-wrap:anywhere;
  background-image:linear-gradient(var(--dust) 1px,transparent 1px),linear-gradient(90deg,var(--dust) 1px,transparent 1px); background-size:28px 28px}
a{color:var(--sky)}
:focus-visible{outline:2px dashed var(--yellow); outline-offset:3px}
.wrap{max-width:1280px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* 상단 띠 */
.top{border-bottom:2px solid var(--line)}
.top .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; padding-block:14px}
.brand{font-family:var(--chalk-f); font-size:2.1rem; font-weight:700; color:var(--chalk); text-decoration:none; letter-spacing:.02em; line-height:1}
.brand em{font-style:normal; color:var(--yellow)}
.brand small{font-size:1.05rem; color:var(--muted); font-weight:400; margin-left:6px}
.topnav{display:flex; gap:4px 14px; flex-wrap:wrap; margin-left:auto; font-family:var(--chalk-f); font-size:1.25rem}
.topnav a{color:var(--muted); text-decoration:none; padding:2px 6px; border-radius:4px}
.topnav a.on,.topnav a:hover{color:var(--chalk); box-shadow:inset 0 -2px 0 var(--yellow)}
.me{display:flex; gap:8px; align-items:center; font-size:.85rem; color:var(--muted)}
.rankchip{font-family:var(--chalk-f); font-size:1.1rem; color:var(--board); background:var(--yellow); padding:0 10px; border-radius:3px}

/* 대시보드 */
.dash{display:grid; gap:34px; padding-block:28px 60px}
.hero{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:28px; align-items:end}
@media (max-width:820px){ .hero{grid-template-columns:1fr} }
.eyebrow{font-family:var(--chalk-f); font-size:1.15rem; color:var(--yellow); letter-spacing:.06em}
.today{margin:6px 0 10px; font-family:var(--chalk-f); font-size:clamp(1.7rem,3.6vw,2.6rem); line-height:1.3; text-shadow:0 0 1px var(--chalk)}
.today-who{color:var(--muted); font-size:.95rem}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.stat{border:1.5px dashed var(--line); padding:10px 12px; border-radius:6px; display:grid}
.stat b{font-family:var(--chalk-f); font-size:2rem; line-height:1.1; font-variant-numeric:tabular-nums}
.stat b small{font-size:1rem; color:var(--muted)}
.stat span{font-size:.8rem; color:var(--muted)}
.cont{grid-column:1/-1; text-align:center}

.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr)); gap:22px}
.subj{background:var(--board-2); border-radius:10px; padding:20px 18px 14px; border-top:4px solid var(--sc); min-width:0}
.subj-head{display:grid; gap:4px; margin-bottom:10px}
.subj h2{font-family:var(--chalk-f); font-size:2.1rem; color:var(--sc)}
.badge{justify-self:start; font-size:.75rem; padding:1px 8px; border-radius:20px; border:1px solid currentColor}
.badge.on{color:var(--green)} .badge.off{color:var(--muted)}
.subj-sub{font-size:.85rem; color:var(--muted)}
.bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--sc); border-radius:4px}
.bar-t{font-size:.78rem; color:var(--muted); font-family:var(--mono-f)}
.unit{margin-top:12px}
.unit h3{font-family:var(--chalk-f); font-size:1.3rem; color:var(--chalk); opacity:.85; margin-bottom:4px}
.nodes{list-style:none; margin:0; padding:0 0 0 9px; border-left:2px solid var(--line)}
.node{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:baseline; padding:5px 8px 5px 0; color:var(--chalk); text-decoration:none; border-radius:4px; margin-left:-15px}
.node:hover{background:var(--grid)}
.node .dot{width:12px; height:12px; border-radius:50%; border:2px solid var(--sc); background:var(--board-2); transform:translateY(1px)}
.node.done .dot{background:var(--sc); box-shadow:0 0 8px var(--sc)}
.node.done .n-t{color:var(--sc)}
.n-t{font-size:.98rem}
.n-w{font-size:.75rem; color:var(--muted); font-family:var(--chalk-f); font-size:1rem}
.n-x{font-size:.75rem; color:var(--red); font-family:var(--mono-f)}

.sec-h{font-family:var(--chalk-f); font-size:1.9rem}
.chains{display:grid; gap:12px}
.chain{display:grid; gap:4px; padding-top:10px; border-top:1px dashed var(--line)}
.chain-n{font-family:var(--chalk-f); font-size:1.2rem; color:var(--yellow)}
.chain-l{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{font-size:.85rem; padding:2px 10px; border-radius:20px; border:1px solid var(--line); color:var(--chalk); text-decoration:none}
.chip.done{border-color:var(--green); color:var(--green)}
.chip.due{border-color:var(--red); color:var(--red); margin-left:8px}
.arr{color:var(--muted)}

/* 버튼 */
.btn{font:inherit; font-size:.92rem; cursor:pointer; padding:7px 14px; border-radius:6px; border:1.5px solid var(--chalk); background:transparent; color:var(--chalk); text-decoration:none; display:inline-block; line-height:1.35}
.btn:hover{background:var(--grid)}
.btn:disabled{opacity:.45; cursor:default}
.btn.primary{background:var(--yellow); border-color:var(--yellow); color:var(--board); font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line)}
.btn.sm{font-size:.82rem; padding:4px 10px}
.btn.big{font-family:var(--chalk-f); font-size:1.5rem; padding:10px 24px}
.btn.on{background:var(--sky-fill); border-color:var(--sky)}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

/* 연구실 */
.room{max-width:980px; margin:0 auto; padding-block:22px 70px; display:grid; gap:30px}
.crumb{font-size:.85rem; color:var(--muted)}
.crumb a{color:var(--muted)}
.room-h{position:relative; border-bottom:3px solid var(--sc); padding-bottom:12px}
.room-h h1{font-family:var(--chalk-f); font-size:clamp(2.3rem,6vw,3.4rem); color:var(--sc); text-shadow:0 0 1px var(--sc)}
.who{color:var(--muted); font-family:var(--chalk-f); font-size:1.25rem}
.stamp{position:absolute; right:0; bottom:12px; font-family:var(--chalk-f); font-size:1.4rem; color:var(--green); border:2px solid var(--green); padding:0 10px; transform:rotate(-6deg); border-radius:4px}
.blk{display:grid; gap:12px; min-width:0}
.blk > *, .prob > *, .lab > *{min-width:0}
.blk-h{font-family:var(--chalk-f); font-size:1.75rem; display:flex; align-items:center; gap:10px}
.glyph{display:inline-grid; place-items:center; width:34px; height:34px; border-radius:50%; border:2px solid var(--sc); color:var(--sc); font-size:1.15rem; flex:none}
.prose{max-width:72ch}
.prose p+p{margin-top:.7em}
.prose b{color:var(--yellow); font-weight:700}
.mystery{font-size:1.08rem; border-left:3px solid var(--sc); padding-left:16px}
.lab{background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:16px; display:grid; gap:12px; min-width:0}
.try{font-size:.95rem; color:var(--muted)} .try b{color:var(--sc); margin-right:4px}
.sim{display:grid; gap:12px; min-width:0}
.plot{width:100%; min-width:0}
.plot canvas{display:block; width:100%; border-radius:6px; background:var(--board)}
.ctrls{display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center}
.sl{display:flex; align-items:center; gap:10px; font-size:.92rem; flex:1 1 240px; min-width:0}
.sl-name{white-space:nowrap; color:var(--muted)}
.sl input[type=range]{flex:1; min-width:90px; accent-color:var(--yellow)}
.sl output{font-family:var(--mono-f); min-width:4.2em; text-align:right; font-size:.88rem; font-variant-numeric:tabular-nums}
select,input[type=text]{font:inherit; background:var(--board); color:var(--chalk); border:1.5px solid var(--line); border-radius:6px; padding:5px 10px}
input[type=text]{width:9em; font-family:var(--mono-f)}
.readout{font-family:var(--mono-f); font-size:.9rem; background:var(--board); border-radius:6px; padding:10px 14px; line-height:1.7; overflow-x:auto; font-variant-numeric:tabular-nums}
.readout .y{color:var(--yellow)} .readout .b{color:var(--sky)} .readout .p{color:var(--pink)} .readout .g{color:var(--green)} .readout .r{color:var(--red)}
.readout.big{font-size:1.05rem}
.simnote{font-size:.9rem; color:var(--muted)}
.key{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.85rem; color:var(--muted)}
.key i{display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:6px; border-radius:2px}

.guess{display:grid; gap:12px}
.opts{display:grid; gap:8px}
.opts.num{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.opt{font:inherit; text-align:left; cursor:pointer; padding:9px 14px; border-radius:6px; border:1.5px solid var(--line); background:var(--board-2); color:var(--chalk)}
.opt:hover:not(:disabled){border-color:var(--chalk)}
.opt.right{border-color:var(--green); background:var(--green-fill)}
.opt.nope{border-color:var(--red); background:color-mix(in srgb,var(--red) 16%,transparent)}
.opt .cn{color:var(--muted); margin-right:4px}
.reveal{border-left:3px solid var(--green); padding-left:14px}
.ok{color:var(--green)!important} .ng{color:var(--red)!important}

.theorem{border:2px solid var(--sc); border-radius:8px; padding:16px 18px; background:var(--board-2); max-width:none}
.theorem h4{margin:0 0 6px; font-family:var(--chalk-f); font-size:1.35rem; color:var(--sc); font-weight:700}
.sub-h{font-family:var(--chalk-f); font-size:1.35rem; margin-top:18px}
.proof{margin:8px 0 10px; padding-left:1.6em; display:grid; gap:6px}
.proof li{animation:chalkin .5s ease both}
.proof li::marker{color:var(--muted); font-family:var(--mono-f); font-size:.85em}
.qed-mark{list-style:none; font-size:1.4rem; color:var(--green); text-align:right}
@keyframes chalkin{from{opacity:.0; transform:translateY(4px)} to{opacity:1; transform:none}}
.deeper{margin-top:14px; border-top:1px dashed var(--line); padding-top:8px}
.deeper summary{cursor:pointer; font-family:var(--chalk-f); font-size:1.2rem; color:var(--sky)}
.exam{display:grid; gap:8px; padding-left:1.3em; margin:0}
.exam li::marker{color:var(--sc)}

.probs{display:grid; gap:16px}
.prob{border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; display:grid; gap:10px; background:var(--board-2); min-width:0}
.prob.solved{border-color:var(--green)}
.prob-h{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.lv{font-family:var(--mono-f); font-size:.75rem; padding:1px 8px; border-radius:3px; font-weight:600}
.lv2{background:var(--green-fill); color:var(--green)} .lv3{background:var(--sky-fill); color:var(--sky)} .lv4{background:var(--pink-fill); color:var(--pink)}
.pno{font-family:var(--chalk-f); font-size:1.15rem; color:var(--muted)}
.fb:empty{display:none}
.hint,.sol{border-left:3px solid var(--sky); padding:4px 0 4px 14px}
.sol{border-color:var(--yellow)}
.hints{display:grid; gap:8px}
.wr-from{font-size:.9rem; margin-top:8px}
.empty{font-family:var(--chalk-f); font-size:1.4rem; color:var(--muted); padding:30px 0}

.finish{display:grid; gap:18px; justify-items:center; padding-top:16px; border-top:2px dashed var(--line)}
.pn{display:flex; justify-content:space-between; width:100%; gap:10px; flex-wrap:wrap}

/* 카드 */
.page{padding-block:24px 60px; display:grid; gap:14px}
.page-h{font-family:var(--chalk-f); font-size:2.6rem}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:14px}
.tcard{display:grid; gap:8px; align-content:start; padding:14px; border-radius:8px; background:var(--board-2); border:1.5px solid var(--sc); color:var(--chalk); text-decoration:none; min-height:150px}
.tcard.locked{border-style:dashed; border-color:var(--line); color:var(--muted)}
.tc-s{font-size:.72rem; color:var(--muted); font-family:var(--mono-f)}
.tc-t{font-family:var(--chalk-f); font-size:1.25rem; line-height:1.35}
.tcard.locked .tc-t{font-size:2rem}
.tc-w{font-size:.8rem; color:var(--muted); margin-top:auto}

.qed-ov{position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:color-mix(in srgb,var(--board) 82%,transparent); padding:20px max(16px, env(safe-area-inset-left,0px)); animation:chalkin .3s ease}
.qed-card{background:var(--board-2); border:2px solid var(--yellow); border-radius:12px; padding:26px; max-width:480px; width:100%; display:grid; gap:10px; text-align:center}
.qed-big{font-family:var(--chalk-f); font-size:3.6rem; color:var(--yellow); line-height:1; clip-path:inset(0 100% 0 0); animation:write 1.1s .15s ease forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.card-t{font-family:var(--chalk-f); font-size:1.45rem}

mjx-container{color:inherit} mjx-container[display="true"]{overflow-x:auto; overflow-y:hidden; max-width:100%; margin:.6em 0!important}
.foot{border-top:1px solid var(--line); color:var(--muted); font-size:.8rem}
.foot .wrap{padding-block:16px}
</style>
